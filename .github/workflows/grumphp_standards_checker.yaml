name: 'Coding standards validation via GrumPHP'

on: pull_request

jobs:
  phpcs-checker:
    name: 'PHPMD Coding standards validation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Installing reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
        
      - name: Configuring diff file
        run: |
          # Add the current directory to the list of safe directories for Git
          git config --global --add safe.directory .
          GIT_CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r --diff-filter=ACM origin/$GITHUB_BASE_REF origin/$GITHUB_HEAD_REF)        
          echo "$GIT_CHANGED_FILES"
          cd scripts/grumphp && composer install && cd ../..
      
      - name: Install ESlint dependencies
        run: |
          VERSION=$(composer show drupal/core --locked | grep 'versions' | awk '{print $4}')
          echo "Version the drupal/core = $VERSION"
          mkdir -p web/core
          cd web
          wget https://git.drupalcode.org/project/drupal/raw/$VERSION/.eslintrc.json
          wget https://git.drupalcode.org/project/drupal/raw/$VERSION/.eslintignore
          cd core
          wget https://git.drupalcode.org/project/drupal/raw/$VERSION/core/.eslintignore
          wget https://git.drupalcode.org/project/drupal/raw/$VERSION/core/.eslintrc.jquery.json
          wget https://git.drupalcode.org/project/drupal/raw/$VERSION/core/.eslintrc.json
          wget https://git.drupalcode.org/project/drupal/raw/$VERSION/core/.eslintrc.legacy.json
          wget https://git.drupalcode.org/project/drupal/raw/$VERSION/core/.eslintrc.passing.json
          cd ../..
      
      - name: Run GrumPHP(PHPMD)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Temporary files for capturing streams
          STDOUT_FILE=$(mktemp)
          STDERR_FILE=$(mktemp)
          # Run GrumPHP and handle streams
          echo "$GIT_CHANGED_FILES" \
            | ./scripts/grumphp/vendor/bin/grumphp run --tasks=phpmd --no-interaction --config=scripts/grumphp/grumphp.yml \
            > >(tee "$STDOUT_FILE") \
            2> "$STDERR_FILE" || true
          # Check if STDERR_FILE is non-empty
          if [ -s "$STDERR_FILE" ]; then
          cat "$STDERR_FILE" \
            | sed -r "s/([0-9]+)\s+/\1:/gI" \
            | reviewdog -fail-level=any -f=phpstan -name="PHPMD GrumPHP"  -reporter=github-pr-review -filter-mode=nofilter || REVIEWDOG_FAILED=1
          else
            echo "No errors found in PHP files. Skipping reviewdog."
          fi
          # Clean up temporary files
          rm -f "$STDOUT_FILE" "$STDERR_FILE"

      - name: Run GrumPHP(PHPCS)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Temporary files for capturing streams
          STDOUT_FILE=$(mktemp)
          STDERR_FILE=$(mktemp)
          # Run GrumPHP and handle streams
          echo "$GIT_CHANGED_FILES" \
            | ./scripts/grumphp/vendor/bin/grumphp run --tasks=phpcs --no-interaction --config=scripts/grumphp/grumphp.yml \
            > >(tee "$STDOUT_FILE") \
            2> "$STDERR_FILE" || true
          # Check if STDERR_FILE is non-empty
          if [ -s "$STDERR_FILE" ]; then
            # Pass stderr to reviewdog
            cat "$STDERR_FILE" | reviewdog -fail-level=any -f=checkstyle -name="PHPCS GrumPHP" -reporter=github-pr-review -filter-mode=nofilter || REVIEWDOG_FAILED=1
          else
            echo "No errors found in PHP files. Skipping reviewdog."
          fi
          # Clean up temporary files
          rm -f "$STDOUT_FILE" "$STDERR_FILE"

      - name: Run GrumPHP(Eslint)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Temporary files for capturing streams
          STDOUT_FILE=$(mktemp)
          STDERR_FILE=$(mktemp)
          # Run GrumPHP and handle streams
          echo "$GIT_CHANGED_FILES" \
            | ./scripts/grumphp/vendor/bin/grumphp run --tasks=eslint --no-interaction --config=scripts/grumphp/grumphp.yml \
            > >(tee "$STDOUT_FILE") \
            2> "$STDERR_FILE" || true
          # Check if STDERR_FILE is non-empty
          if [ -s "$STDERR_FILE" ]; then
            # Pass stderr to reviewdog
            cat "$STDERR_FILE" | reviewdog -fail-level=any -f=eslint -name="Eslint GrumPHP" -reporter=github-pr-review -filter-mode=nofilter || REVIEWDOG_FAILED=1
          else
            echo "No errors found in JS files. Skipping reviewdog."
          fi
          # Clean up temporary files
          rm -f "$STDOUT_FILE" "$STDERR_FILE"      
      

